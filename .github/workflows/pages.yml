# Publishes the backend-free PREVIEW build of order-site to GitHub Pages
# (order.jianchatea.com). The real ordering system runs server.js on a server;
# see order-site/README.md.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main, claude/connect-order-jianchatea-domain-eq2p8i]
    paths: ['order-site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node order-site/scripts/build-preview.js _site/index.html
      - run: |
          touch _site/.nojekyll
          cp _site/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
