<!doctype html>
<html lang="th">
<head>
<title>Cart | JIANCHA x NAVORI</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="data:,">
</head>
<body>
<div class="wrap">
  <header class="site-head" id="site-head"></header>

  <section>
    <div class="row-between"><div class="label" id="lbl-match"></div><span id="stock-pill" style="margin-bottom:14px"></span></div>
    <div class="err" id="stock-err"></div>
    <div class="matches" id="matches"></div>
  </section>

  <section class="section">
    <div class="label" id="lbl-pickup"></div>
    <div class="chips" id="stores"></div>
  </section>

  <section class="section">
    <div class="label" id="lbl-cart"></div>
    <div class="summary">
      <div>
        <div class="panel" style="padding:8px 0"><ul class="cart-table" id="lines"></ul></div>
        <div class="notebox"><b>หมายเหตุ</b><textarea id="note" rows="1"></textarea></div>
      </div>
      <div>
        <div class="sumbox bordered">
          <h3>Order Summary</h3><span class="sub th">สรุปราคารวม</span>
          <hr>
          <div class="tot"><span class="th">ยอดรวมราคาสินค้า</span><b id="total">0.00 ฿</b></div>
          <hr>
          <div class="store" id="store-name" style="font-size:15px">-</div>
        </div>
        <button type="button" class="confirm" id="confirm"><b>Confirm</b><small class="th">ยืนยันคำสั่งซื้อ</small></button>
        <div class="err" id="err"></div>
      </div>
    </div>
  </section>
</div>
<script src="/js/app.js"></script>
<script>
(async () => {
  renderHeader('cart');
  $('#lbl-match').innerHTML = ICONS.match + ' Your Match';
  $('#lbl-pickup').innerHTML = ICONS.pin + ' Pick-up Location';
  $('#lbl-cart').innerHTML = ICONS.cart + ' Cart Summary';
  const [menu, stores] = await Promise.all([getMenu(), api('/api/stores')]);
  const map = menuMap(menu);
  let stock = menu.stock; const getStock = () => stock;
  async function refreshStock() { try { stock = await api('/api/stock'); } catch (e) { /* keep last */ } render(); }
  $('#note').value = getNote();
  $('#note').addEventListener('input', (e) => setNote(e.target.value));
  $('#stores').addEventListener('click', (e) => { const b = e.target.closest('[data-store]'); if (b) { setStore(b.dataset.store); render(); } });
  bindMatchControls($('#matches'), render, { getStock, errEl: $('#stock-err') });
  function render() {
    const cart = loadCart(); const storeId = getStore(); const store = stores.find((s) => s.id === storeId);
    $('#stock-pill').innerHTML = stockPill(stock);
    $('#confirm').disabled = Boolean(stock && stock.sold_out);
    $('#matches').innerHTML = cart.map((l) => matchCard(l, map)).join('') || '<div class="match add">ตะกร้าว่าง<br><a href="/">กลับไปเลือกเมนู</a></div>';
    $('#stores').innerHTML = storeChips(stores, storeId);
    // aggregate per menu item, as in the design
    const agg = new Map();
    for (const l of cart) for (const p of lineParts(l, map)) { const a = agg.get(p.id) || { ...p, qty: 0 }; a.qty += l.quantity; agg.set(p.id, a); }
    $('#lines').innerHTML = Array.from(agg.values()).map((a) => `<li><span>${esc(a.name_en)}</span><span>x ${a.qty}</span><span class="p">${money(a.price * a.qty)} ฿</span></li>`).join('') || '<li><span class="empty">ยังไม่มีรายการ</span></li>';
    const total = cart.reduce((s, l) => s + linePrice(l, map) * l.quantity, 0);
    $('#total').textContent = money(total) + ' ฿';
    $('#store-name').innerHTML = store ? `<span class="th" style="font-size:13px;display:block">สถานที่รับของ</span>${esc(store.brand)} - ${esc(store.name)}` : '<span class="th" style="font-weight:400;font-size:13px">ยังไม่ได้เลือกสถานที่รับของ</span>';
    updateCartBadge();
  }
  render();
  $('#confirm').addEventListener('click', () => submitOrder({ storeId: getStore(), note: $('#note').value, errEl: $('#err'), btn: $('#confirm'), onFail: refreshStock }));
})();
</script>
</body>
</html>
