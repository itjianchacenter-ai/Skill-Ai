<!doctype html>
<html lang="th">
<head>
<title>Order Receipt | JIANCHA x NAVORI</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="data:,">
</head>
<body>
<div class="wrap">
  <header class="site-head no-print" id="site-head"></header>
  <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
    <button type="button" class="btn" id="print"></button>
    <a class="btn ghost" href="/orders" id="back-orders"></a>
  </div>
  <div id="receipt"></div>
</div>
<script src="/js/app.js"></script>
<script>
(async () => {
  renderHeader('orders');
  $('#print').innerHTML = ICONS.print + ' Print <span class="th">/ พิมพ์ใบรายการ</span>';
  $('#back-orders').innerHTML = ICONS.doc + ' Order History';
  const params = new URLSearchParams(location.search);
  const id = params.get('order');
  let o;
  try { o = await api('/api/orders/' + encodeURIComponent(id)); } catch (e) { $('#receipt').innerHTML = '<div class="empty">ไม่พบคำสั่งซื้อ / Order not found</div>'; return; }
  const rows = o.lines.map((l) => {
    const items = orderLineItems(l);
    return `<tr><td>${esc(orderLineName(l))}${items ? `<br><small class="items-inline">${esc(items)}</small>` : ''}</td><td class="q">${l.quantity}</td><td class="p">${money(l.unit_price)}</td><td class="p">${money(l.line_total)}</td></tr>`;
  }).join('');
  const [en, th] = STATUS_LABEL[o.status] || [o.status, ''];
  $('#receipt').innerHTML = `
    <div class="receipt">
      <div class="r-head"><b>JIANCHA x NAVORI</b><span class="th">ใบรายการสั่งซื้อ / Order Receipt</span></div>
      <table class="r-meta">
        <tr><th>Order Number</th><td class="mono">${esc(o.order_number)}</td></tr>
        <tr><th>Date <span class="th">/ วันที่สั่ง</span></th><td>${fmtDateTime(o.created_at)}</td></tr>
        <tr><th>Pick-up Location <span class="th">/ สถานที่รับของ</span></th><td><b>${esc(o.store_name)}</b></td></tr>
        <tr><th>Status <span class="th">/ สถานะ</span></th><td>${en} <span class="th">(${th})</span>${o.paid_at ? ' · ' + fmtDateTime(o.paid_at) : ''}</td></tr>
        ${o.note ? `<tr><th>หมายเหตุ</th><td>${esc(o.note)}</td></tr>` : ''}
        ${o.promo_code ? `<tr><th>Promotion code <span class="th">/ รหัสโปรโมชัน (POS)</span></th><td class="mono">${esc(o.promo_code)}</td></tr>` : ''}
      </table>
      <table class="r-lines">
        <thead><tr><th>Item <span class="th">/ รายการ</span></th><th class="q">Qty</th><th class="p">Unit (฿)</th><th class="p">Total (฿)</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><th colspan="3">Total <span class="th">/ ยอดรวม</span></th><th class="p">${money(o.total)} ฿</th></tr></tfoot>
      </table>
      <p class="r-foot th">กรุณาแสดงใบรายการนี้หรือแจ้งเลขคำสั่งซื้อที่สาขาเพื่อรับสินค้า<br><span style="font-family:Montserrat,sans-serif">Show this receipt or quote your order number at the store to pick up.</span></p>
    </div>`;
  $('#print').addEventListener('click', () => window.print());
  if (params.get('print') === '1') setTimeout(() => window.print(), 300);
})();
</script>
</body>
</html>
