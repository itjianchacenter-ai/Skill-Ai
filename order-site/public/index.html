<!doctype html>
<html lang="th">
<head>
<title>JIANCHA x NAVORI | Order</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+Thai:wght@400;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"><link rel="icon" href="data:,">
</head>
<body>
<div class="wrap">
  <header class="site-head" id="site-head"></header>

  <div class="hero ph" id="hero"></div>

  <section class="section">
    <div class="row-between">
      <div class="label" id="lbl-sets"></div>
      <span id="stock-pill" style="margin-bottom:14px"></span>
    </div>
    <div class="err" id="stock-err"></div>
    <div class="sets" id="sets"></div>
  </section>

  <section class="section">
    <div class="label" id="lbl-pickup"></div>
    <div class="chips" id="stores"></div>
  </section>

  <section class="section">
    <div class="label" id="lbl-summary"></div>
    <div class="summary">
      <div>
        <div class="panel"><ul class="lines" id="lines"></ul></div>
        <div class="notebox"><b>หมายเหตุ</b><textarea id="note" rows="1" placeholder=""></textarea></div>
      </div>
      <div>
        <div class="sumbox blue">
          <h3>Order Summary</h3><span class="sub th">สรุปราคารวม</span>
          <hr>
          <div class="tot"><span class="th">ยอดรวมราคาสินค้า</span><b id="total">0.00 ฿</b></div>
          <hr>
          <h3 style="margin-top:14px">Pick-up Location</h3><span class="sub th">สถานที่รับของ</span>
          <hr>
          <div class="store" id="store-name">-</div>
          <hr>
        </div>
        <button type="button" class="confirm" id="confirm"><b>Confirm</b><small class="th">ยืนยันคำสั่งซื้อ</small></button>
        <div class="err" id="err"></div>
      </div>
    </div>
  </section>
</div>
<script src="/js/app.js"></script>
<script>
(async () => {
  renderHeader('home');
  $('#lbl-sets').innerHTML = ICONS.match + ' Match Sets';
  $('#lbl-pickup').innerHTML = ICONS.pin + ' Pick-up Location';
  $('#lbl-summary').innerHTML = ICONS.tag + ' Order Summary';

  const [menu, stores] = await Promise.all([getMenu(), api('/api/stores')]);
  const map = menuMap(menu);
  let stock = menu.stock; const getStock = () => stock;
  async function refreshStock() { try { stock = await api('/api/stock'); } catch (e) { /* keep last */ } render(); }
  if (menu.banner) $('#hero').outerHTML = '<img class="hero" style="object-fit:cover;width:calc(100% - 80px)" src="' + esc(menu.banner) + '" alt="">';

  // One card per Match Set. Ticking the circle puts the set in the order; − / + change the quantity.
  const setCard = (s) => {
    const line = cartLine(s.id); const qty = line ? line.quantity : 0;
    const img = (src, cls) => (src ? `<img class="ph ${cls}" src="${esc(src)}" alt="">` : `<div class="ph ${cls}"></div>`);
    const smalls = [0, 1, 2].map((i) => img((s.images || [])[i], '')).join('');
    return `<div class="set ${qty ? 'picked' : ''}" data-set="${esc(s.id)}">
      <div class="set-imgs">${img(s.image, 'big')}<div class="small">${smalls}</div><span class="set-tag">${esc(s.label)}</span></div>
      <div class="set-meta">
        <label class="pick"><input type="checkbox" data-pick="${esc(s.id)}" ${qty ? 'checked' : ''}><span class="radio"></span></label>
        <div class="names">
          <span class="en">${esc(s.name_en)}</span><span class="th">${esc(s.name_th)}</span>
          <ul class="items">${(s.items || []).map((i) => `<li>${esc(i.name_en)}${i.name_th ? ` <span class="th">(${esc(i.name_th)})</span>` : ''}</li>`).join('')}</ul>
        </div>
        <div class="right">
          <b class="price">${money(s.price)}</b>
          <span class="qty-pill"><button type="button" data-dec="${esc(s.id)}" aria-label="ลด">−</button><span>x ${qty || 1}</span><button type="button" data-inc="${esc(s.id)}" aria-label="เพิ่ม">+</button></span>
        </div>
      </div>
    </div>`;
  };
  const sets = $('#sets');
  sets.addEventListener('change', (e) => {
    const cb = e.target.closest('[data-pick]'); if (!cb) return;
    const s = map[cb.dataset.pick];
    if (cb.checked) {
      const short = stockCheck(stock, loadCart(), setPieces(s), map);
      if (short) { $('#stock-err').textContent = short; cb.checked = false; return; }
      $('#stock-err').textContent = ''; cartAdd(s.id, 1);
    } else cartSetQty(s.id, 0);
    render();
  });
  sets.addEventListener('click', (e) => {
    const t = e.target.closest('[data-inc],[data-dec]'); if (!t) return;
    const id = t.dataset.inc || t.dataset.dec; const s = map[id]; const line = cartLine(id);
    if (t.dataset.inc) {
      const short = stockCheck(stock, loadCart(), setPieces(s), map);
      if (short) { $('#stock-err').textContent = short; return; }
      $('#stock-err').textContent = '';
      if (line) cartSetQty(id, Math.min(99, line.quantity + 1)); else cartAdd(id, 1);
    } else if (line) cartSetQty(id, line.quantity - 1);
    render();
  });

  $('#note').value = getNote();
  $('#note').addEventListener('input', (e) => setNote(e.target.value));
  $('#stores').addEventListener('click', (e) => { const b = e.target.closest('[data-store]'); if (b) { setStore(b.dataset.store); render(); } });

  function render() {
    const cart = loadCart(); const storeId = getStore(); const store = stores.find((s) => s.id === storeId);
    $('#stock-pill').innerHTML = stockPill(stock);
    $('#confirm').disabled = Boolean(stock && stock.sold_out);
    sets.innerHTML = (menu.sets || []).map(setCard).join('') || '<div class="empty">ยังไม่มีเซ็ตเมนู</div>';
    $('#stores').innerHTML = storeChips(stores, storeId);
    const lines = cart.map((l) => `<li><span>${esc(lineName(l, map))}</span><span class="n">x ${l.quantity}</span><span class="p">${money(linePrice(l, map) * l.quantity)} ฿</span></li>`);
    while (lines.length < 4) lines.push('<li class="blank"></li>');
    $('#lines').innerHTML = lines.join('');
    const total = cart.reduce((s, l) => s + linePrice(l, map) * l.quantity, 0);
    $('#total').textContent = money(total) + ' ฿';
    $('#store-name').textContent = store ? `${store.brand} - ${store.name}` : '-';
    updateCartBadge();
  }
  render();
  $('#confirm').addEventListener('click', () => submitOrder({ storeId: getStore(), note: $('#note').value, errEl: $('#err'), btn: $('#confirm'), onFail: refreshStock }));
})();
</script>
</body>
</html>
